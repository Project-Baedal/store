services:
  postgres:
    container_name: postgresql-store
    image: postgres:17.4
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store

  elasticsearch:
    image: elasticsearch:9.0.1
    container_name: elasticsearch-store
    command: >
      /bin/bash -c "
      elasticsearch-plugin install analysis-nori --batch &&
      elasticsearch
      "
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  postgres-data:
  es-data:

